# SDK preview branch mapping, not a production-site migration.
# These are the SAME identity keys as the existing nested preview project.
# Do not merge/apply to the live site without preserving its production keys.
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Reflag docs — SDK versioning preview
  structure:
    - type: section
      key: sdk-preview-javascript
      title: JavaScript SDKs
      path: sdk
      default: true
      children:
        - type: space
          key: sdk-preview-v2
          title: v2 (candidate)
          path: v2
          default: true
          content:
            directory: ./previews/sdk-versioning/v2
        - type: space
          key: sdk-preview-v1
          title: v1 (legacy)
          path: v1
          content:
            directory: ./previews/sdk-versioning/v1
    - type: section
      key: sdk-preview-guides
      title: Shared docs
      path: guides
      children:
        - type: space
          key: sdk-preview-shared
          title: Shared docs
          path: current
          default: true
          content:
            directory: ./previews/sdk-versioning/shared
