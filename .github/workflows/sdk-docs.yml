name: SDK documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - .generated/**
      - .github/scripts/**
      - .github/workflows/sdk-docs.yml
      - gitbook-docs.yaml
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/sdk-docs.yml

permissions:
  contents: read

jobs:
  check:
    name: Importer safety and existing navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/sdk-docs.test.mjs
      - run: node .github/scripts/check-sdk-docs.mjs
      - name: Report public-content cutover readiness without publishing
        run: node .github/scripts/sdk-docs.mjs ready
